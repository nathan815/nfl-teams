[build]
  command = "echo static site, no build"
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  framework = "#static"
  staticServerPort = 3996

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
